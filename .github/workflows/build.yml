name: Android build & Release v1.05

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Restore the repository's persistent debug keystore so every CI and AI Studio
      # installable APK shares the exact same signing certificate (enables in-place updates).
      # If optional release keystore secrets are configured, prepare them for assembleRelease too.
      - name: Prepare persistent signing keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release-keystore.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble persistently signed APK and release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/OptiShare-QR-v1.05.apk
          else
            cp -f app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OptiShare-QR-v1.05.apk
          fi

      - name: List generated APKs
        run: |
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: optishare-qr-v1.05-apks
          path: |
            app/build/outputs/apk/debug/OptiShare-QR-v1.05.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish v1.05 to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.05"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          # Ensure tag v1.05 exists on the repository so F-Droid and GitHub Releases can track it
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "OptiShare QR $RELEASE_TAG"
            git push origin "$RELEASE_TAG" || true
          fi

          RELEASE_ASSETS=(
            app/build/outputs/apk/debug/OptiShare-QR-v1.05.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          )

          NOTES_FILE="fastlane/metadata/android/it/changelogs/5.txt"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "OptiShare QR $RELEASE_TAG" \
                --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" \
                "${RELEASE_ASSETS[@]}" \
                --title "OptiShare QR $RELEASE_TAG" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" \
                "${RELEASE_ASSETS[@]}" \
                --title "OptiShare QR $RELEASE_TAG" \
                --generate-notes
            fi
          fi
