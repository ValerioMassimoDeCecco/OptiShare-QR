name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Debug APKs are signed automatically by AGP and can be installed without
      # configuring release signing secrets. The debug signing identity may not
      # match APKs signed with another key, so an existing install may need to
      # be removed before installing this one.
      - name: Assemble installable debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: List the APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: optishare-qr-debug-installable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk \
            --title "OptiShare QR $GITHUB_REF_NAME (debug-signed)" \
            --generate-notes
